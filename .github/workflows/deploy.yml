name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
  SERVICE_NAME: ${{ vars.GCP_SERVICE_NAME }}
  MIGRATION_JOB: ${{ vars.GCP_MIGRATION_JOB }}
  CLOUD_SQL_INSTANCE: ${{ vars.GCP_CLOUD_SQL_INSTANCE }}
  PUBLIC_ORIGIN: ${{ vars.GCP_PUBLIC_ORIGIN }}
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/approval-system

jobs:
  build-and-push:
    name: Build and push image (commit SHA)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Define image tag
        id: meta
        run: echo "image=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Run database migrations
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Create or update the migration job
        run: |
          gcloud run jobs deploy "${MIGRATION_JOB}" \
            --image "${{ needs.build-and-push.outputs.image }}@${{ needs.build-and-push.outputs.digest }}" \
            --region "${REGION}" \
            --set-cloudsql-instances "${CLOUD_SQL_INSTANCE}" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest" \
            --command "npx" \
            --args "prisma,migrate,deploy,--schema,prisma/schema.prisma" \
            --max-retries 1 \
            --task-timeout 600 \
            --quiet

      - name: Execute migrations and wait
        run: gcloud run jobs execute "${MIGRATION_JOB}" --region "${REGION}" --wait --quiet

  deploy:
    name: Deploy Cloud Run service
    needs: [build-and-push, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      service_url: ${{ steps.url.outputs.service_url }}

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy the reviewed image by digest
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --image "${{ needs.build-and-push.outputs.image }}@${{ needs.build-and-push.outputs.digest }}" \
            --region "${REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --port 3000 \
            --cpu 1 \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 3 \
            --add-cloudsql-instances "${CLOUD_SQL_INSTANCE}" \
            --set-env-vars "NODE_ENV=production,GIT_COMMIT=${GITHUB_SHA},CLIENT_ORIGIN=${PUBLIC_ORIGIN}" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest" \
            --quiet

      - name: Read the public service URL
        id: url
        run: |
          service_url="$(gcloud run services describe "${SERVICE_NAME}" \
            --region "${REGION}" \
            --format='value(status.url)')"
          echo "service_url=${service_url}" >> "$GITHUB_OUTPUT"
          echo "Deployed ${service_url}"

  smoke:
    name: Smoke-test the deployed release
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify health and running commit
        run: |
          curl --fail --silent --show-error "${{ needs.deploy.outputs.service_url }}/api/health" | tee health.json
          grep --quiet '"status":"ok"' health.json
          grep --quiet "${GITHUB_SHA}" health.json
          echo "Release ${GITHUB_SHA} is serving from ${{ needs.deploy.outputs.service_url }}"
